name: iOS Native
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/ios-*']
    paths: ['ios-app/**', '.github/workflows/ios-ci.yml']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - uses: actions/cache@v4
        with:
          path: |
            ios-app/.build
            ios-app/DerivedData/SourcePackages
          key: ios-dependencies-${{ runner.os }}-${{ hashFiles('ios-app/Package.swift') }}
      - name: Core tests
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee core-tests.log
      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          swift scripts/make_icon.swift
          xcodegen generate
      - name: Build standalone iPhone app
        run: |
          set -o pipefail
          xcodebuild -project QluCampus.xcodeproj -scheme QluCampus -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee device-build.log
          mkdir -p dist/Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/QluCampus.app dist/Payload/
          cd dist && zip -qr QluCampus-iOS-0.1.0-unsigned.ipa Payload
      - name: Build WidgetKit extension
        run: |
          set -o pipefail
          xcodebuild -project QluCampus.xcodeproj -scheme TodayWidget -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee widget-build.log
      - name: Check optional App Group build
        run: |
          set -o pipefail
          xcodegen generate --spec project-widget.yml
          xcodebuild -project QluCampus.xcodeproj -scheme QluCampus -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee widget-app-build.log
          xcodegen generate
      - name: Simulator UI tests
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if "iPhone" in x["name"]))')
          xcodebuild -project QluCampus.xcodeproj -scheme QluCampus -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath DerivedData -resultBundlePath ui-tests.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ui-tests.log
          xcrun simctl launch "$DEVICE" com.qlucampus.ios --uitest
          sleep 2
          xcrun simctl io "$DEVICE" screenshot dist/ios-simulator.png
      - name: Package corresponding source
        if: always()
        run: python3 scripts/package_source.py
      - name: Upload build and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QluCampus-iOS-preview
          path: |
            ios-app/dist/*.ipa
            ios-app/dist/*.png
            ios-app/*.log
            ios-app/ui-tests.xcresult
            ios-app/dist/*.zip
          retention-days: 14
